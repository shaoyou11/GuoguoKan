name: 编译果果看
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 检查工具链与版本
        shell: bash
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcrun swift --version
          SDK_VERSION=$(xcrun --sdk macosx --show-sdk-version)
          test "${SDK_VERSION%%.*}" -ge 27
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
      - name: 测试
        run: swift test --scratch-path "$HOME/Library/Caches/GuoguoKan-build" -c release --arch arm64
      - name: 编译与打包
        run: bash build.sh
      - name: 验证压缩包
        shell: bash
        run: |
          ditto -x -k 交付/GuoguoKan-*.zip "$RUNNER_TEMP/verify"
          codesign --verify --deep --strict "$RUNNER_TEMP/verify/果果看.app"
          test "$(lipo -archs "$RUNNER_TEMP/verify/果果看.app/Contents/MacOS/GuoguoKan")" = arm64
          cd 交付
          shasum -a 256 GuoguoKan-*.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GuoguoKan-arm64
          path: |
            交付/GuoguoKan-*.zip
            交付/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: 发布版本
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" 交付/GuoguoKan-*.zip 交付/SHA256SUMS.txt --verify-tag --title "果果看 $GITHUB_REF_NAME" --notes "Apple Silicon · macOS 27+。自动编译并通过测试。使用 ad-hoc 签名，尚未完成 Developer ID 公证。"
